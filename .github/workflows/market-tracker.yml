name: US Market Auto Tracker

on:
  workflow_dispatch: # 随时可以在 GitHub 网页点击手动执行测试！
  schedule:
    # --- 夏令时点位 (EDT = UTC-4) ---
    - cron: '53 12 * * 1-5'   # 原 09:00 EDT，提前到 08:53 避开整点拥堵 (12:53 UTC)
    - cron: '35 13 * * 1-5'   # 09:35 EDT (13:35 UTC)
    - cron: '53 16 * * 1-5'   # 原 13:00 EDT，提前到 12:53 避开整点拥堵 (16:53 UTC)
    - cron: '5 20 * * 1-5'    # 16:05 EDT (20:05 UTC)

    # --- 冬令时点位 (EST = UTC-5) ---
    - cron: '53 13 * * 1-5'   # 原 09:00 EST，提前到 08:53 避开整点拥堵 (13:53 UTC)
    - cron: '35 14 * * 1-5'   # 09:35 EST (14:35 UTC)
    - cron: '53 17 * * 1-5'   # 原 13:00 EST，提前到 12:53 避开整点拥堵 (17:53 UTC)
    - cron: '5 21 * * 1-5'    # 16:05 EST (21:05 UTC)

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Digest Script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python scripts/digest.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. 提交 JSON 数据文件
          git add _data/market_summary.json
          
          # 2. 安全判断：只有当图表文件夹确实生成了，才提交它
          if [ -d "assets/charts/" ]; then
            git add assets/charts/
          fi
          
          # 3. 检查是否有文件改动并推送
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market digest and chart [skip ci]"
            git push
          fi
