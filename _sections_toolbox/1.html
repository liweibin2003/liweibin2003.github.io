<!-- External Libraries for Image Processing -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.3/dist/browser/index.js"></script>

<style>
    /* Image Workspace Styles */
    .img-workspace {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        border: 1px solid #eaeaea;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #333;
        margin-top: 20px;
    }

    /* Top: Function Navigation */
    .img-nav {
        display: flex;
        background: #f8fafc;
        border-bottom: 1px solid #eaeaea;
        overflow-x: auto;
    }
    .img-nav-btn {
        flex: 1;
        padding: 15px 10px;
        background: transparent !important;
        border: none;
        font-size: 14px;
        font-weight: 600;
        color: #64748b !important; /* Added !important to override Jekyll theme */
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
        text-align: center;
    }
    .img-nav-btn:hover { color: #007bff !important; background: #f1f5f9 !important; }
    .img-nav-btn.active { color: #007bff !important; border-bottom: 3px solid #007bff !important; background: #fff !important; }

    /* Sub-Top: Tool Options Panel */
    .img-tool-panel {
        display: none;
        padding: 15px 20px;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
        animation: fadeIn 0.3s ease;
    }
    .img-tool-panel.active { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }

    /* Middle: Interactive Preview Area */
    .img-preview-container {
        position: relative;
        width: 100%;
        height: 500px;
        background: #e2e8f0;
        background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
                          linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
                          linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
                          linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #img-source { max-width: 100%; max-height: 100%; display: none; }
    
    .upload-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.9);
        cursor: pointer;
        z-index: 10;
        transition: opacity 0.3s;
    }
    .upload-overlay:hover { background: rgba(240,248,255,0.95); }
    .upload-overlay i { font-size: 40px; color: #007bff; margin-bottom: 10px; }
    .upload-overlay h3 { color: #333 !important; margin: 0 0 5px 0; }

    /* Bottom: Action Bar */
    .img-action-bar {
        padding: 15px 20px;
        background: #f8fafc;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #eaeaea;
        flex-wrap: wrap;
        gap: 15px;
    }
    
    .action-left { display: flex; align-items: center; gap: 10px; }
    
    /* Privacy Notice Style */
    .privacy-notice {
        font-size: 13px;
        color: #10b981; /* Green color to indicate safety */
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        text-align: center;
        flex: 1;
        justify-content: center;
    }

    /* UI Components (Buttons, Sliders, Selects) */
    .t-btn {
        padding: 8px 16px; border-radius: 6px; border: none; font-size: 14px;
        font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .t-btn-primary { background: #007bff !important; color: white !important; }
    .t-btn-primary:hover { background: #0056b3 !important; }
    .t-btn-primary:disabled { background: #94a3b8 !important; cursor: not-allowed; }
    
    .t-btn-outline { background: transparent !important; border: 1px solid #cbd5e1 !important; color: #475569 !important; }
    .t-btn-outline:hover { background: #f1f5f9 !important; }
    .t-btn-outline:disabled { color: #94a3b8 !important; border-color: #e2e8f0 !important; cursor: not-allowed; }
    
    .t-select, .t-input { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; color: #333 !important; }
    .t-slider-group { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #475569; }
    
    #loading-indicator { display: none; color: #007bff; font-weight: bold; font-size: 14px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* Responsive adjustments */
