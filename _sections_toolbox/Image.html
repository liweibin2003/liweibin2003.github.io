<!-- External Libraries for Image Processing -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
    /* Image Workspace Styles */
    .img-workspace {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        border: 1px solid #eaeaea;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #333;
        margin-top: 20px;
    }

    /* Top: Function Navigation */
    .img-workspace .img-nav {
        display: flex;
        background: #f8fafc;
        border-bottom: 1px solid #eaeaea;
        overflow-x: auto;
    }
    .img-workspace .img-nav-btn {
        flex: 1;
        padding: 15px 10px;
        background: transparent !important;
        border: none;
        font-size: 14px;
        font-weight: 600;
        color: #64748b !important;
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
        text-align: center;
    }
    .img-workspace .img-nav-btn:hover { color: #007bff !important; background: #f1f5f9 !important; }
    .img-workspace .img-nav-btn.active { color: #007bff !important; border-bottom: 3px solid #007bff !important; background: #fff !important; }

    /* Sub-Top: Tool Options Panel */
    .img-workspace .img-tool-panel {
        display: none;
        padding: 15px 20px;
        background: #fff;
        border-bottom: 1px solid #eaeaea;
        animation: fadeIn 0.3s ease;
    }
    .img-workspace .img-tool-panel.active { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }

    /* Middle: Interactive Preview Area */
    .img-workspace .img-preview-container {
        position: relative;
        width: 100%;
        height: 500px;
        background: #e2e8f0;
        background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%),
                          linear-gradient(-45deg, #cbd5e1 25%, transparent 25%),
                          linear-gradient(45deg, transparent 75%, #cbd5e1 75%),
                          linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #img-source { max-width: 100%; max-height: 100%; display: none; }

    .img-workspace .upload-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.9);
        cursor: pointer;
        z-index: 10;
        transition: opacity 0.3s;
    }
    .img-workspace .upload-overlay:hover { background: rgba(240,248,255,0.95); }
    .img-workspace .upload-overlay i { font-size: 40px; color: #007bff; margin-bottom: 10px; font-style: normal; }
    .img-workspace .upload-overlay h3 { color: #333 !important; margin: 0 0 5px 0; }

    /* Bottom: Action Bar */
    .img-workspace .img-action-bar {
        padding: 15px 20px;
        background: #f8fafc;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #eaeaea;
        flex-wrap: wrap;
        gap: 15px;
    }

    .img-workspace .action-left { display: flex; align-items: center; gap: 10px; }

    .img-workspace .privacy-notice {
        font-size: 13px;
        color: #10b981;
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        text-align: center;
        flex: 1;
        justify-content: center;
    }

    /* UI Components Scoped */
    .img-workspace .t-btn {
        padding: 8px 16px; border-radius: 6px; border: none; font-size: 14px;
        font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .img-workspace .t-btn-primary { background: #007bff !important; color: white !important; }
    .img-workspace .t-btn-primary:hover { background: #0056b3 !important; }
    .img-workspace .t-btn-primary:disabled { background: #94a3b8 !important; cursor: not-allowed; }

    .img-workspace .t-btn-outline { background: transparent !important; border: 1px solid #cbd5e1 !important; color: #475569 !important; }
    .img-workspace .t-btn-outline:hover { background: #f1f5f9 !important; }
    .img-workspace .t-btn-outline:disabled { color: #94a3b8 !important; border-color: #e2e8f0 !important; cursor: not-allowed; }

    .img-workspace .t-select, .img-workspace .t-input { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; color: #333 !important; }
    .img-workspace .t-slider-group { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #475569; }

    #img-loading-indicator { display: none; color: #007bff; font-weight: bold; font-size: 14px; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 768px) {
        .img-workspace .img-action-bar { flex-direction: column; }
        .img-workspace .privacy-notice { order: 3; margin-top: 10px; }
    }
</style>

<div class="img-workspace">
    <!-- Top: Navigation -->
    <div class="img-nav">
        <button class="img-nav-btn active" onclick="switchImgTab('img-tab-format', this)">1. Format & Compress</button>
        <button class="img-nav-btn" onclick="switchImgTab('img-tab-crop', this)">2. Crop & Resize</button>
        <button class="img-nav-btn" onclick="switchImgTab('img-tab-bg', this)">3. Background Removal</button>
        <button class="img-nav-btn" onclick="switchImgTab('img-tab-color', this)">4. Color Adjustment</button>
    </div>

    <!-- 1. Format & Compress Panel -->
    <div id="img-tab-format" class="img-tool-panel active">
        <select id="img-export-format" class="t-select">
            <option value="image/jpeg">Export as JPG</option>
            <option value="image/png">Export as PNG</option>
            <option value="image/webp">Export as WEBP</option>
        </select>
        <div class="t-slider-group">
            <label>Compression Quality:</label>
            <input type="range" id="img-export-quality" min="0.1" max="1.0" step="0.1" value="0.9">
            <span id="img-quality-val">90%</span>
        </div>
    </div>

    <!-- 2. Crop Panel -->
    <div id="img-tab-crop" class="img-tool-panel">
        <button class="t-btn t-btn-outline" onclick="imgSetCropRatio(NaN)">Free Crop</button>
        <button class="t-btn t-btn-outline" onclick="imgSetCropRatio(1)">1:1 (Square)</button>
        <button class="t-btn t-btn-outline" onclick="imgSetCropRatio(16/9)">16:9 (Video)</button>
        <button class="t-btn t-btn-outline" onclick="imgSetCropRatio(4/3)">4:3</button>
        <button class="t-btn t-btn-primary" onclick="imgApplyCrop()" style="margin-left: auto;">✔️ Apply Crop</button>
    </div>

    <!-- 3. Background Removal Panel -->
    <div id="img-tab-bg" class="img-tool-panel">
        <button class="t-btn t-btn-primary" onclick="imgRemoveBackground()">🪄 Auto Remove Background</button>
        <div class="t-slider-group" style="margin-left: 20px;">
            <label>ID Photo BG Color:</label>
            <input type="color" id="img-id-bg-color" value="#ffffff" onchange="imgChangeBgColor(this.value)">
            <button class="t-btn t-btn-outline" onclick="imgChangeBgColor('transparent')">Transparent</button>
        </div>
    </div>

    <!-- 4. Color Adjustment Panel -->
    <div id="img-tab-color" class="img-tool-panel">
        <div class="t-slider-group"><label>Brightness</label><input type="range" id="img-f-bright" min="0" max="200" value="100" oninput="imgApplyFilters()"></div>
        <div class="t-slider-group"><label>Contrast</label><input type="range" id="img-f-contrast" min="0" max="200" value="100" oninput="imgApplyFilters()"></div>
        <div class="t-slider-group"><label>Saturation</label><input type="range" id="img-f-saturate" min="0" max="200" value="100" oninput="imgApplyFilters()"></div>
        <button class="t-btn t-btn-outline" onclick="imgResetFilters()">Reset Colors</button>
    </div>

    <!-- Middle: Preview Workspace -->
    <div class="img-preview-container" id="img-workspace-area">
        <div class="upload-overlay" id="img-upload-overlay" onclick="document.getElementById('img-main-image-upload').click()">
            <i>📸</i>
            <h3>Click or Drop Image Here</h3>
            <p style="color:#64748b; font-size: 13px;">Supports JPG, PNG, WEBP</p>
        </div>
        <input type="file" id="img-main-image-upload" accept="image/*" style="display: none;" onchange="imgLoadMainImage(event)">
        <img id="img-source" src="" alt="Workspace Image">
    </div>

    <!-- Bottom: Action Bar -->
    <div class="img-action-bar">
        <div class="action-left">
            <button class="t-btn t-btn-outline" onclick="imgResetWorkspace()" id="img-btn-reset" disabled>🗑️ Clear Workspace</button>
            <span id="img-loading-indicator">Processing... Please wait.</span>
        </div>

        <div class="privacy-notice">
            🛡️ 100% Local Processing: Your files never leave your device.
        </div>

        <button class="t-btn t-btn-primary" onclick="imgDownloadResult()" id="img-btn-download" disabled>💾 Download Result</button>
    </div>
</div>

<script>
    let cropperInstance = null;
    let imglyModule = null; 
    const imgElement = document.getElementById('img-source');
    
    // Lazy load the elements instead of evaluating on page load (safer if DOM renders async)
    const getImgOverlay = () => document.getElementById('img-upload-overlay');
    const getImgWorkspace = () => document.getElementById('img-workspace-area');

    function imgLoadMainImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        imgElement.src = url;
        imgElement.style.display = 'block';
        getImgOverlay().style.display = 'none';

        document.getElementById('img-btn-reset').disabled = false;
        document.getElementById('img-btn-download').disabled = false;

        destroyCropper();
        imgResetFilters();
        getImgWorkspace().style.backgroundColor = 'transparent';
    }

    function imgResetWorkspace() {
        imgElement.src = '';
        imgElement.style.display = 'none';
        getImgOverlay().style.display = 'flex';
        document.getElementById('img-main-image-upload').value = '';
        document.getElementById('img-btn-reset').disabled = true;
        document.getElementById('img-btn-download').disabled = true;
        destroyCropper();
        imgResetFilters();
        getImgWorkspace().style.backgroundColor = 'transparent';
    }

    function switchImgTab(tabId, btn) {
        document.querySelectorAll('.img-workspace .img-tool-panel').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.img-workspace .img-nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');

        if (tabId === 'img-tab-crop' && imgElement.getAttribute('src')) {
            initCropper();
        } else {
            destroyCropper();
        }
    }

    function initCropper() {
        if (!cropperInstance && imgElement.getAttribute('src')) {
            imgElement.style.filter = 'none';
            cropperInstance = new Cropper(imgElement, {
                viewMode: 1,
                dragMode: 'crop',
                autoCropArea: 0.8,
                restore: false,
                guides: true,
                center: true,
                highlight: false,
                cropBoxMovable: true,
                cropBoxResizable: true,
                toggleDragModeOnDblclick: false,
            });
        }
    }

    function destroyCropper() {
        if (cropperInstance) {
            cropperInstance.destroy();
            cropperInstance = null;
            imgApplyFilters();
        }
    }

    function imgSetCropRatio(ratio) {
        if (cropperInstance) {
            cropperInstance.setAspectRatio(ratio);
        }
    }

    function imgApplyCrop() {
        if (cropperInstance) {
            const canvas = cropperInstance.getCroppedCanvas();
            const newSrc = canvas.toDataURL('image/png');
            destroyCropper();
            imgElement.src = newSrc;
            setTimeout(initCropper, 100);
        }
    }

    async function loadImgly() {
        if (imglyModule) return imglyModule;
        const urls = [
            'https://esm.sh/@imgly/background-removal@1.5.5',
            'https://esm.sh/@imgly/background-removal@1.4.3',
            'https://staticimgly.com/@imgly/background-removal/1.5.5/dist/index.mjs'
        ];
        const errors = [];
        for (const url of urls) {
            try {
                imglyModule = await import(url);
                return imglyModule;
            } catch (e) {
                errors.push(url + ' -> ' + e.message);
            }
        }
        throw new Error('Cannot load background removal library:\n' + errors.join('\n'));
    }

    async function imgRemoveBackground() {
        if (!imgElement.getAttribute('src')) return alert("Please upload an image first.");

        destroyCropper();

        const loader = document.getElementById('img-loading-indicator');
        loader.style.display = 'inline-block';
        loader.innerText = "Loading AI Model & Processing...";

        try {
            const lib = await loadImgly();
            const response = await fetch(imgElement.src);
            const blob = await response.blob();
            const removeFn = lib.removeBackground || (lib.default && lib.default.removeBackground) || lib.default;
            
            if (typeof removeFn !== 'function') {
                throw new Error('removeBackground export not found in loaded module');
            }

            const resultBlob = await removeFn(blob, {
                progress: (key, current, total) => {
                    if (total) {
                        loader.innerText = `Loading ${key}: ${Math.round(current / total * 100)}%`;
                    }
                }
            });

            imgElement.src = URL.createObjectURL(resultBlob);
            document.getElementById('img-export-format').value = 'image/png';
        } catch (error) {
            console.error(error);
            alert("Background removal failed: " + error.message);
        } finally {
            loader.style.display = 'none';
        }
    }

    function imgChangeBgColor(color) {
        getImgWorkspace().style.backgroundColor = (color === 'transparent') ? 'transparent' : color;
    }

    function imgApplyFilters() {
        if (cropperInstance) return;
        const brightness = document.getElementById('img-f-bright').value;
        const contrast = document.getElementById('img-f-contrast').value;
        const saturate = document.getElementById('img-f-saturate').value;

        imgElement.style.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%)`;
    }

    function imgResetFilters() {
        document.getElementById('img-f-bright').value = 100;
        document.getElementById('img-f-contrast').value = 100;
        document.getElementById('img-f-saturate').value = 100;
        imgApplyFilters();
    }

    document.getElementById('img-export-quality').addEventListener('input', function(e) {
        document.getElementById('img-quality-val').innerText = Math.round(e.target.value * 100) + '%';
    });

    function imgDownloadResult() {
        if (!imgElement.getAttribute('src')) return;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const format = document.getElementById('img-export-format').value;
        const quality = parseFloat(document.getElementById('img-export-quality').value);

        const bakeImg = new Image();
        bakeImg.crossOrigin = "anonymous";
        bakeImg.onload = function() {
            canvas.width = bakeImg.naturalWidth;
            canvas.height = bakeImg.naturalHeight;

            const bgColor = getImgWorkspace().style.backgroundColor;
            if (bgColor && bgColor !== 'transparent' && bgColor !== 'rgba(0, 0, 0, 0)') {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (format === 'image/jpeg') {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            const brightness = document.getElementById('img-f-bright').value;
            const contrast = document.getElementById('img-f-contrast').value;
            const saturate = document.getElementById('img-f-saturate').value;
            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%)`;

            ctx.drawImage(bakeImg, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL(format, quality);
            const a = document.createElement('a');
            a.href = dataUrl;
            const ext = format.split('/')[1];
            a.download = `edited_image.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
        bakeImg.src = imgElement.src;
    }
</script>
